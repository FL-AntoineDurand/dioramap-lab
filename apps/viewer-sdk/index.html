<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dioramap viewer-sdk — V2 dev page</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d1117; color: #e6edf3;
                   font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      #app { position: fixed; inset: 0; }
      /* V6 dev-only — minimal panel to exercise the SDK's models API.
         Lives outside the SDK bundle. Lower-left so it doesn't clash
         with the controls-panel (top-right) or the compass (bottom-right). */
      #models-panel {
        position: fixed; left: 12px; bottom: 12px; z-index: 50;
        background: rgba(0,0,0,0.55); padding: 10px 12px; border-radius: 6px;
        font-size: 12px; line-height: 1.6; min-width: 180px; color: #ddd;
        backdrop-filter: blur(4px);
      }
      #models-panel h4 { margin: 0 0 6px 0; font-size: 11px; opacity: 0.7;
                          text-transform: uppercase; letter-spacing: 0.5px; }
      #models-panel button { display: block; width: 100%; margin-top: 4px;
                             padding: 6px 10px; background: #1f6feb;
                             color: #fff; border: 0; border-radius: 4px;
                             font-size: 12px; cursor: pointer; }
      #models-panel button:hover { background: #388bfd; }
      #models-panel button.placed { background: #2a3038; }
      #models-panel .placed-list { margin-top: 8px; padding-top: 6px;
                                    border-top: 1px solid rgba(255,255,255,0.15); }
      #models-panel .placed-list .row { display: flex; gap: 4px;
                                         align-items: center; margin-top: 4px;
                                         font-size: 11px; opacity: 0.85; }
      #models-panel .placed-list .row button {
        margin: 0; padding: 2px 6px; width: auto; font-size: 10px;
        background: #c44; flex: none; }
      #models-panel .placed-list .row span { flex: 1; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="models-panel">
      <h4>Models (V6 dev test)</h4>
      <button data-glb="/models/storage-shed.glb">+ Storage shed</button>
      <button data-glb="/models/cabin-shed.glb">+ Cabin shed</button>
      <button data-glb="/models/swimming-pool.glb">+ Swimming pool</button>
      <div class="placed-list" id="placed-list"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
