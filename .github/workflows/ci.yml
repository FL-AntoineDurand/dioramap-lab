name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine (${{ matrix.build }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build: [Release, Debug-ASan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libwebsockets-dev libcurl4-openssl-dev libproj-dev libjpeg-dev \
            libjansson-dev libsqlite3-dev libssl-dev libxxhash-dev libwebp-dev \
            python3-websockets
      - name: Fetch third-party (copc-lib, laz-perf)
        run: ./scripts/fetch-third-party.sh
      - name: Configure
        run: |
          if [ "${{ matrix.build }}" = "Debug-ASan" ]; then
            cmake -S core -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DDIORAMAP_ASAN=ON
          else
            cmake -S core -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi
      - name: Build
        run: ninja -C build
      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4

  apps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install + build
        run: |
          for a in protocol scene-base location-picker viewer-sdk lab-ui; do
            (cd apps/$a && npm ci --no-audit --no-fund)
          done
          (cd apps/scene-base && npm test)
          for a in location-picker viewer-sdk lab-ui; do
            (cd apps/$a && npm run build)
          done
